{% extends "base.html" %}
{% block title %}{{ shop.name }} – {{ t.done_title }}{% endblock %}
{% block body %}
<main class="public">
  <div class="public-card">
    <section class="card done-card">
      <span class="done-check">{{ icon('check') }}</span>
      <h1>{{ t.done_title }}</h1>
      <p class="text-2">{{ t.done_body }}</p>
      <div class="trust"><span>{{ icon('wallet') }}{{ t.trust_cod }}</span><span>{{ icon('chat') }}{{ t.trust_whatsapp }}</span></div>
      <p class="small muted mt-8">{{ shop.name }}</p>
    </section>
    <p class="powered">COD Confirm</p>
  </div>
</main>
{% endblock %}
