{% extends "base.html" %}
{% block title %}{{ shop.name }} – {{ t.done_title }}{% endblock %}
{% block body %}
<main class="mx-auto max-w-md px-4 py-16 text-center">
  <div class="rounded-2xl bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold text-emerald-700">{{ t.done_title }}</h1>
    <p class="mt-3 text-slate-600">{{ t.done_body }}</p>
    <p class="mt-6 text-sm text-slate-400">{{ shop.name }}</p>
  </div>
</main>
{% endblock %}
