{% extends "base.html" %}
{% block body %}
<div class="min-h-screen">
  <header class="border-b bg-slate-900 text-white">
    <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
      <a href="/admin" class="text-lg font-bold">COD Confirm · Admin</a>
      <nav class="flex gap-3 text-sm text-slate-300">
        <a href="/admin" class="hover:text-white">Boutiques</a>
        <a href="/admin/shops/new" class="hover:text-white">+ Nouvelle boutique</a>
      </nav>
      <form method="post" action="/logout" class="ml-auto">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <button class="text-sm text-slate-300 hover:text-white">{{ user.email }} · Déconnexion</button>
      </form>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-6">{% block content %}{% endblock %}</main>
</div>
{% endblock %}
