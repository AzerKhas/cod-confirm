{% if orders %}
  {% include "dashboard/_orders_rows.html" %}
  <div class="mt-3 flex items-center gap-3 text-sm text-slate-500">
    <span>{{ total }} commande(s)</span>
    {% if pages > 1 %}
      <span class="ml-auto">Page {{ page }} / {{ pages }}</span>
      {% if page > 1 %}<a class="text-emerald-700" href="?status={{ status_filter }}&q={{ q|urlencode }}&page={{ page - 1 }}">← Précédente</a>{% endif %}
      {% if page < pages %}<a class="text-emerald-700" href="?status={{ status_filter }}&q={{ q|urlencode }}&page={{ page + 1 }}">Suivante →</a>{% endif %}
    {% endif %}
  </div>
{% else %}
  <p class="text-sm text-slate-500">Aucune commande trouvée.</p>
{% endif %}
