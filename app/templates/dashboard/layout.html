{% extends "base.html" %}
{% block body %}
<script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
<div class="min-h-screen" hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <header class="border-b bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-4 px-4 py-3">
      <a href="/dashboard" class="text-lg font-bold text-emerald-700">COD Confirm</a>
      <span class="text-sm text-slate-500">{{ shop.name }}</span>
      <nav class="flex gap-3 text-sm">
        <a href="/dashboard" class="hover:text-emerald-700">Tableau de bord</a>
        <a href="/dashboard/orders" class="hover:text-emerald-700">Commandes</a>
        {% if user.role.value == 'owner' %}<a href="/dashboard/settings" class="hover:text-emerald-700">Réglages</a>{% endif %}
      </nav>
      <form method="post" action="/logout" class="ml-auto">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <button class="text-sm text-slate-500 hover:text-red-600">{{ user.email }} · Déconnexion</button>
      </form>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
