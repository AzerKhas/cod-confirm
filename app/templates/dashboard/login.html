{% extends "base.html" %}
{% block title %}Connexion – COD Confirm{% endblock %}
{% block body %}
<main class="mx-auto max-w-sm px-4 py-20">
  <h1 class="mb-6 text-center text-2xl font-bold text-emerald-700">COD Confirm</h1>
  <form method="post" action="/login" class="space-y-4 rounded-2xl bg-white p-6 shadow-sm">
    {% if error %}<div class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>{% endif %}
    <div>
      <label class="block text-sm font-medium" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" maxlength="254"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium" for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" maxlength="200"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
    </div>
    <button class="w-full rounded-xl bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-700">Se connecter</button>
  </form>
</main>
{% endblock %}
