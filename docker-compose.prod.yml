# Production stack: Caddy (HTTPS, automatic Let's Encrypt) -> app -> PostgreSQL, + nightly backups.
#
#   cp .env.example .env      # fill every value, APP_ENV=prod, DOMAIN=app.example.tn
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). The database is on an internal
# network with no published port. See DEPLOY.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cod_confirm
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cod -d cod_confirm"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://cod:${POSTGRES_PASSWORD}@db:5432/cod_confirm
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
      # Trust X-Forwarded-* only from the Caddy container (the app port is not published).
      FORWARDED_ALLOW_IPS: "*"
      SCHEDULER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [frontend]
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: cod
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: cod_confirm
      BACKUP_DIR: /backups
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    # First backup 1 minute after start, then every 24 h.
    entrypoint: ["sh", "-c", "apk add --no-cache openssl >/dev/null; sleep 60; while true; do sh /usr/local/bin/backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    logging: *logging

networks:
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
