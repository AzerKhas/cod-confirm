# Render blueprint (https://render.com): web service from the Dockerfile + managed PostgreSQL.
# Render terminates HTTPS. Set the remaining secrets in the dashboard (sync: false).
services:
  - type: web
    name: cod-confirm
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: cod-confirm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "*"

databases:
  - name: cod-confirm-db
    plan: basic-256mb
    databaseName: cod_confirm
    user: cod
