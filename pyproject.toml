[project]
name = "cod-confirm"
version = "0.1.0"
description = "Automatic WhatsApp confirmation of Cash-On-Delivery orders (Tunisia / Maghreb)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
